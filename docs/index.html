<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Content-Security-Policy: the real content is written at build time by scripts/gen-csp.mjs,
       which hashes the inline scripts below (a hash-based script-src is what makes the policy worth
       having — 'unsafe-inline' would allow exactly what it is meant to stop). Must stay ahead of
       every script/style/link so it governs them. GitHub Pages cannot set headers, hence <meta>;
       frame-ancestors is header-only and therefore NOT covered here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdn.sheetjs.com https://accounts.google.com 'sha256-DHmDDdO8IFATCqDEMMAC5I9wIee8tFQMMvBaksaN914=' 'sha256-CBbRHxGAd+B94ChI4g5/oF6vMOK2X7xdqfSS50tv0wo=' 'sha256-ewaVtQKz+1ZH+npNTVVVgrUvHqt5qUZh2vSu1AJn7ps=' 'sha256-dIYKujHxQzXXKWCI/YNc07pHURwE9Mu0oJSgSPI90qA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://vdg-lbs-edge.lbs-vdg.workers.dev https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://cdn.jsdelivr.net https://huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'" />
  <!-- Base path: '/' at a domain root; a subpath (e.g. /Repo/) for a GitHub Pages project site.
       dist seds /VDG_FreightForwarder_Publish_LBS/. Must precede every relative src/href below so they resolve
       against it (and document.baseURI, used by fetch + dynamic import). -->
  <base href="/VDG_FreightForwarder_Publish_LBS/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VDG FreightForwarder</title>

  <!-- PWA: manifest resolves against <base>, so the subpath deploy (GitHub Pages) keeps working -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1e40af" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Google Fonts: dynamic CSS per font-variant negotiation — SRI not applicable (hash changes per UA/subset) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <script type="module">
    import { isDevHost } from './js/implementations/kernel/core_abstractions/util/dev-host.js';
    if (isDevHost(location.hostname, location.protocol)) {
      const oldErr = console.error;
      console.error = function(...args) {
        if (String(args[0]).includes('[GSI_LOGGER]')) {
          oldErr.apply(console, args);
          return;
        }
        document.body.insertAdjacentHTML('afterbegin', '<div onclick="this.remove()" style="cursor:pointer;position:fixed;top:100px;left:50px;background:orange;color:black;z-index:999999;padding:20px;font-size:18px;max-width:800px;overflow:auto;">CONSOLE ERR: ' + String(args[0]) + (args[1] && args[1].stack ? ' ' + args[1].stack : '') + '<br><small>(Click to dismiss)</small></div>');
        oldErr.apply(console, args);
      };
      window.addEventListener('error', e => {
        document.body.insertAdjacentHTML('afterbegin', '<div onclick="this.remove()" style="cursor:pointer;position:fixed;top:50px;left:50px;background:red;color:white;z-index:999999;padding:20px;font-size:24px;">' + e.message + '<br><small>(Click to dismiss)</small></div>');
      });
      window.addEventListener('unhandledrejection', e => {
        document.body.insertAdjacentHTML('afterbegin', '<div onclick="this.remove()" style="cursor:pointer;position:fixed;top:50px;left:50px;background:red;color:white;z-index:999999;padding:20px;font-size:24px;max-width:800px;overflow:auto;">' + (e.reason && e.reason.stack || e.reason) + '<br><small>(Click to dismiss)</small></div>');
      });
    }
  </script>
  <!-- Dark mode disabled until the view layer has dark: variants — force light, ignore stale saved pref -->
  <script>document.documentElement.classList.remove('dark');</script>

  <link rel="stylesheet" href="css/styles.css" />

  <!-- AG Grid community 31.3.2 — pinned, SRI-protected -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css"
    integrity="sha384-LNcL0K2K7L8L9H0XdFjFVke0Q1STyt3EhtpjMIai3xF3YpjvIOIoQlplKoTiaCS0"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css"
    integrity="sha384-uTU2hjrm7DPUmOLAzmReq/x6GkOLV02xfmo+RhGpMCURmmNbiZGfGouIdpLh9m1u"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"
    integrity="sha384-0cD1zEe4XGTK8UhKDApU/gCZiWTHgDHKDV7g6/7SDKxCi3hjeBxmI2G04f2871jf"
    crossorigin="anonymous"
  ></script>
  <!-- Chart.js 4.4.3 — pinned, SRI-protected -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js"
    integrity="sha384-tgbB5AKnszdcfwcZtTfuhR3Ko1XZdlDfsLtkxiiAZiVkkXCkFmp+FQFh+V/UTo54"
    crossorigin="anonymous"
  ></script>
  <!-- Google Identity Services — loaded as a PLAIN no-cors script (no integrity/crossorigin).
       gsi/client is a DYNAMIC endpoint (private Cache-Control, Google controls versioning), so an
       SRI hash can't be pinned and `crossorigin="anonymous"` forces a CORS fetch that Google does
       NOT answer with an Access-Control-Allow-Origin header → the "blocked by CORS policy" console
       error. Google's own snippet uses neither attribute. -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>
  <!--
    Lit 3.1.4: loaded via ES module `import` in component JS files — browsers do not support
    `integrity` on dynamic ESM imports, so SRI cannot be applied at the HTML level.
    SheetJS (xlsx-latest): lazy-loaded at runtime via dynamic script injection in close-period.js /
    pnl-report.js using a floating `-latest` URL — SRI not applicable (hash changes on each release).
    Trade-off accepted: both libraries run in isolated module scope; replace with bundled/pinned
    versions when moving to a build pipeline (F-15-10).
  -->

  <style>
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .ag-theme-quartz { --ag-font-family: 'Inter', sans-serif; --ag-font-size: 13px; }
    /* F-15-19 AC-5 — kill UA button border/padding leakage in topbar (Chromium loses to UA in some builds) */
    header button { padding: 0; border: 0; box-sizing: border-box; min-height: 0; }
  </style>
</head>
<body class="h-full">
  <vdg-offline-banner></vdg-offline-banner>
  <vdg-orphan-folder-banner></vdg-orphan-folder-banner>
  <div id="app" class="h-full flex">
    <vdg-sidebar></vdg-sidebar>

    <div class="flex-1 flex flex-col min-w-0">
      <vdg-topbar></vdg-topbar>

      <main id="view-root" class="flex-1 overflow-auto scrollbar-thin">
        <div id="view-loading" class="p-6 text-slate-500 text-sm">Loading view…</div>
        <!-- entry-loader.js reveals this on a static-import-graph load failure (app.js itself,
             or a chunk it statically imports, 503/404ing — e.g. a GitHub Pages deploy-window
             race). Pre-rendered here, not built at runtime: see entry-loader.js for why. Wording
             hand-mirrored from view_mount_failed_network / view_mount_reload in vi.json. -->
        <div id="entry-load-failed" hidden class="flex flex-col items-center justify-center h-full gap-4 text-center p-8">
          <div class="text-lg font-semibold text-slate-700">Không mở được ứng dụng</div>
          <div class="text-sm text-slate-500">Không tải được dữ liệu — có thể bản cập nhật mới đang được phát hành. Bấm Tải lại trang để lấy bản mới nhất.</div>
          <button id="entry-reload-btn" class="mt-2 px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">Tải lại trang</button>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { registerServiceWorker } from './js/bootstrap/sw-register.js';
    registerServiceWorker();
  </script>
  <script type="module">
    import { wireEntryLoad } from './js/bootstrap/entry-loader.js';
    wireEntryLoad(document, 'js/bootstrap/app.js');
  </script>
</body>
</html>
